workflow:
  mode: phase1_codex_native_imagegen_v5

  claude_anonymized_text_sharing:
    policy: configs/agents.yaml
    decision_owner: codex_cco
    repeated_user_confirmation_required: false

  goal: >-
    VSCode Codex CCOを最高責任者とし、CCOが内容を理解して、各Claude Agentへの作業指示・成果物レビュー・修正指示・再レビューを行う。
    Codex Integrated Creative DesignerがImageGen capabilityを直接使い、Adobe素材を優先利用し、適した素材がない場合のみ人物から生成する。
    求人広告の写真・装飾・日本語コピー・Typography・レイアウトを一体制作する。
    Pythonは案件/前処理/候補登録/OCR補助/納品昇格へ限定する。

  intake:
    required:
      - job_file
    optional:
      - hearing_sheet
      - supplementary_text
    defaults_when_unspecified:
      quantity: 1
      width: 1200
      height: 628
      objective: 求人広告画像制作
    hearing_overrides_defaults: true
    job_only_generation_allowed: true

  benchmark_library:
    env: ORIGINAL_IMAGE_ROOT
    default_path: G:/共有ドライブ/ジョブオレチーム/ジョブオレチーム/JOBOLE-Image-Creator-Team/original_image
    shortlist_max: 3
    python_role: index_and_contact_sheet_only
    creative_selection_owner: codex_cco

  production_asset_library:
    env: ADOBE_IMAGE_ROOT
    default_path: G:/共有ドライブ/ジョブオレチーム/ジョブオレチーム/JOBOLE-Image-Creator-Team/Adobe/_image
    policy: adobe_first
    usage_authorized_by_user: true
    python_role: index_and_contact_sheet_only
    selection_owner: codex_cco
    selection_contract: asset_source
    guide: docs/adobe-material-first.md
    generate_people_only_when: completed_visual_search_has_no_suitable_asset
    unavailable_action: stop_asset_selection_and_restore_access

  render_modes:
    config: configs/render_modes.yaml
    default: codex_imagegen
    primary:
      creative_spec_contract: services/creative_spec.py
      generation_owner: codex_integrated_creative_designer
      generation_capability: codex_imagegen
      skill: .codex/skills/recruitment-imagegen/SKILL.md
      python_generates_image: false
      direct_openai_api_required: false
      candidate_registration: scripts/register_codex_candidate.py
    safe:
      design_spec_contract: services/design_spec.py
      renderer: services/overlay_renderer.py
      image_renders_required_text: false
      fallback_only: true
    api_fallback:
      explicit_user_approval_required: true
      silent_activation_forbidden: true

  token_efficiency:
    compact_context_first: true
    raw_source_is_fallback: true
    max_benchmarks: 3
    max_visual_routes: 2
    max_required_text_blocks: 6
    reuse_creative_spec_for_designer_verification_and_review: true
    prefer_edit_before_full_regenerate: true
    root_cause_revision_only: true

  steps:
    - intake
    - context_preparation
    - recruitment_analysis
    - codex_fact_check
    - codex_benchmark_gate
    - adobe_asset_selection
    - creative_direction
    - codex_creative_spec_approval
    - creative_spec_save
    - codex_imagegen_capability_gate
    - codex_integrated_candidate_generation
    - codex_designer_self_check
    - candidate_registration
    - local_text_verification_if_available
    - creative_review_with_visual_text_readback
    - codex_final_qa
    - final_approval_file
    - formal_promotion
    - human_final_approval

  # ownersは各工程の実作業担当。全工程の指揮と各Agent成果物の採否はCodex CCOが担う。
  # 正式11役割の共通指揮系統はconfigs/agents.yamlのcommand_structureとAGENTS.mdに従う。
  owners:
    intake: codex_cco
    context_preparation: python_context_utility
    recruitment_analysis: recruitment_analyst
    codex_fact_check: codex_cco
    codex_benchmark_gate: codex_cco
    adobe_asset_selection: codex_cco
    creative_direction: creative_director
    codex_creative_spec_approval: codex_cco
    creative_spec_save: codex_cco
    codex_imagegen_capability_gate: codex_cco
    codex_integrated_candidate_generation: codex_integrated_creative_designer
    codex_designer_self_check: codex_integrated_creative_designer
    candidate_registration: python_candidate_registration_utility
    local_text_verification_if_available: python_ocr_helper
    creative_review_with_visual_text_readback: codex_independent_creative_reviewer
    codex_final_qa: codex_cco
    final_approval_file: codex_cco
    formal_promotion: python_delivery_utility
    human_final_approval: human

  output_spec_resolution:
    priority:
      - hearing_sheet_media
      - explicit_user_size
      - phase1_default
    config: configs/media.yaml
    generation_must_use_resolved_context: true

  codex_imagegen_generation:
    creative_context_required: true
    approved_creative_spec_required: true
    completed_adobe_asset_selection_required: true
    creative_spec_default_path: 02_direction/<creative-id>-creative-spec.json
    agent: .codex/agents/integrated-creative-designer.md
    skill: .codex/skills/recruitment-imagegen/SKILL.md
    output_is_candidate: true
    canonical_candidate: 03_batches/<creative-id>/<version>/candidate.png
    registration_script: scripts/register_codex_candidate.py
    formal_delivery_direct_write: false
    exact_text_contract_required: true
    no_extra_readable_text: true
    silent_api_fallback_allowed: false

  text_verification:
    layers:
      - codex_designer_self_check
      - local_ocr_when_available
      - independent_reviewer_visual_readback_required
      - codex_cco_final_visual_check_required
    local_ocr_single_source_of_truth: false
    confirmed_text_error_blocks_delivery: true
    confirmed_fact_error_blocks_delivery: true

  gates:
    fact_check:
      owner: codex_cco
      purpose: 求人事実・verbatim表記・数値を固定する

    benchmark_gate:
      owner: codex_cco
      purpose: original_imageから案件に合う参考サンプルを最大3件に絞る

    creative_spec_approval:
      owner: codex_cco
      purpose: コピー・exact text contract・写真・Typography・ImageGen制作方針を生成前に固定する

    adobe_asset_selection:
      owner: codex_cco
      purpose: Adobe素材を目視選定し、採用素材または適合素材なしの理由をasset_sourceへ記録する。接続不可は素材なしと判定しない。

    imagegen_capability_gate:
      owner: codex_cco
      purpose: 現在のCodex runtimeでImageGen capabilityが使えることを確認し、使えなければ自動API fallbackせず停止する

    text_integrity_gate:
      owner: creative_reviewer_and_codex_cco
      purpose: Codex ImageGenが生成した日本語・数字・職種・雇用形態をCreative Specと照合する

    final_qa:
      owner: codex_cco
      purpose: Fact・Hearing・Benchmark・Text・完成品質・複数枚の多様性を最終横断確認する

  revision:
    instruction_owner: codex_cco
    revised_deliverable_review_owner: codex_cco
    max_count: 2
    return_to_responsible_specialist: true
    rerun_all_agents: false
    prefer_image_edit_for_local_defect: true
    same_text_error_twice_may_trigger_safe_fallback: true
    api_fallback_requires_user_approval: true

  delivery:
    candidate_directory: 03_batches/<creative-id>/<version>
    formal_directory: 05_delivery
    formal_directory_images_only: true
    supporting_records_directory: 04_project_review/delivery_records/<creative-id>/<version>
    explicit_approval_required: true
    promotion_script: scripts/promote_creative.py
    human_approval_required: true

  future:
    - batch_candidate_ranking
    - automatic_cost_guard_for_explicit_api_fallback
    - slack_intake
    - server_side_orchestration

workflow:
  mode: quality_first
  steps:
    - intake
    - recruitment_analysis
    - codex_fact_gate
    - production_strategy
    - codex_strategy_gate
    - copy_direction
    - art_direction
    - codex_direction_gate
    - prompt_design
    - image_generation
    - creative_review
    - codex_final_traceability_gate
    - revision_if_needed
    - human_final_approval
    - delivery

  statuses:
    - awaiting_input
    - input_ready
    - analyzing
    - planning
    - directing
    - generating
    - review
    - revision
    - needs_clarification
    - needs_human_review
    - completed
    - delivered
    - blocked

  gates:
    fact_gate:
      owner: codex_cco
      after: recruitment_analysis
    strategy_gate:
      owner: codex_cco
      after: production_strategy
    direction_gate:
      owner: codex_cco
      after:
        - copy_direction
        - art_direction
    final_traceability_gate:
      owner: codex_cco
      after: creative_review

  revision:
    max_count: 3
    return_to_root_cause_agent: true
    escalate_after_limit: true

  delivery:
    human_approval_required: true

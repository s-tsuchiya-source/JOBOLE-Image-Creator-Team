workflow:
  mode: phase1_premium_integrated_ai_v4

  goal: >-
    VSCode Codexを最高責任者として、求人ファイル1つからでも一流デザイナー水準を目指す求人広告画像を作る。
    標準は画像AIが写真・装飾・日本語文字まで一体生成するPremium Mode。
    Pythonは前処理・生成制御・OCR照合・候補/納品管理へ縮小し、Safe Mode時だけ文字描画を行う。

  intake:
    required:
      - job_file
    optional:
      - hearing_sheet
      - supplementary_text
    defaults_when_unspecified:
      quantity: 1
      width: 1200
      height: 628
      objective: 求人広告画像制作
    hearing_overrides_defaults: true
    job_only_generation_allowed: true

  benchmark_library:
    env: ORIGINAL_IMAGE_ROOT
    default_path: G:/共有ドライブ/ジョブオレチーム/ジョブオレチーム/JOBOLE-Image-Creator-Team/original_image
    shortlist_max: 3
    python_role: index_and_contact_sheet_only
    creative_selection_owner: codex_cco

  render_modes:
    config: configs/render_modes.yaml
    default: premium_ai
    premium:
      creative_spec_contract: services/creative_spec.py
      image_renders_required_text: true
      text_verification_required: true
      candidate_first: true
    safe:
      design_spec_contract: services/design_spec.py
      renderer: services/overlay_renderer.py
      image_renders_required_text: false
      fallback_only: true

  token_efficiency:
    compact_context_first: true
    raw_source_is_fallback: true
    max_benchmarks: 3
    max_visual_routes: 2
    max_required_text_blocks: 6
    reuse_creative_spec_for_generation_verification_and_review: true
    root_cause_revision_only: true

  steps:
    - intake
    - context_preparation
    - recruitment_analysis
    - codex_fact_check
    - codex_benchmark_gate
    - creative_direction
    - codex_creative_spec_approval
    - creative_spec_save
    - candidate_generation
    - local_text_verification_if_available
    - creative_review_with_visual_text_readback
    - codex_final_qa
    - final_approval_file
    - formal_promotion
    - human_final_approval

  owners:
    intake: codex_cco
    context_preparation: python_context_utility
    recruitment_analysis: recruitment_analyst
    codex_fact_check: codex_cco
    codex_benchmark_gate: codex_cco
    creative_direction: creative_director
    codex_creative_spec_approval: codex_cco
    creative_spec_save: codex_cco
    candidate_generation: python_generation_utility
    local_text_verification_if_available: python_ocr_helper
    creative_review_with_visual_text_readback: creative_reviewer
    codex_final_qa: codex_cco
    final_approval_file: codex_cco
    formal_promotion: python_delivery_utility
    human_final_approval: human

  output_spec_resolution:
    priority:
      - hearing_sheet_media
      - explicit_user_size
      - phase1_default
    config: configs/media.yaml
    generation_must_use_resolved_context: true

  premium_generation:
    creative_context_required: true
    approved_creative_spec_required: true
    creative_spec_default_path: 02_direction/<creative-id>-creative-spec.json
    output_is_candidate: true
    formal_delivery_direct_write: false
    exact_text_contract_required: true
    no_extra_readable_text: true

  text_verification:
    layers:
      - local_ocr_when_available
      - claude_visual_readback_required
      - codex_final_visual_check_required
    local_ocr_single_source_of_truth: false
    confirmed_text_error_blocks_delivery: true
    confirmed_fact_error_blocks_delivery: true

  gates:
    fact_check:
      owner: codex_cco
      purpose: 求人事実・verbatim表記・数値を固定する

    benchmark_gate:
      owner: codex_cco
      purpose: original_imageから案件に合う参考サンプルを最大3件に絞る

    creative_spec_approval:
      owner: codex_cco
      purpose: コピー・exact text contract・写真・Typography・完成広告Promptを生成前に固定する

    text_integrity_gate:
      owner: creative_reviewer_and_codex_cco
      purpose: 画像AIが生成した日本語・数字・職種・雇用形態をCreative Specと照合する

    final_qa:
      owner: codex_cco
      purpose: Fact・Hearing・Benchmark・Text・完成品質を最終横断確認する

  revision:
    max_count: 2
    return_to_responsible_specialist: true
    rerun_all_agents: false
    same_text_error_twice_may_trigger_safe_fallback: true

  delivery:
    candidate_directory: 03_batches/<creative-id>/<version>
    formal_directory: 05_delivery
    explicit_approval_required: true
    promotion_script: scripts/promote_creative.py
    human_approval_required: true

  phase2_later:
    - batch_candidate_ranking
    - automatic_cost_guard
    - slack_intake
    - server_side_orchestration

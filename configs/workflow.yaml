workflow:
  mode: phase1_design_spec_quality_v3

  goal: >-
    VSCode Codexを最高責任者として、求人ファイル1つからでも高品質な求人広告画像を作る。
    画像AIは文字なしビジュアルを作り、ClaudeがDesign Specを設計し、Pythonが正確な日本語を高品質に描画する。

  intake:
    required:
      - job_file
    optional:
      - hearing_sheet
      - supplementary_text
    defaults_when_unspecified:
      quantity: 1
      width: 1200
      height: 628
      objective: 求人広告画像制作
    hearing_overrides_defaults: true
    job_only_generation_allowed: true

  benchmark_library:
    env: ORIGINAL_IMAGE_ROOT
    default_path: G:/共有ドライブ/ジョブオレチーム/ジョブオレチーム/JOBOLE-Image-Creator-Team/original_image
    shortlist_max: 3
    python_role: index_and_contact_sheet_only
    creative_selection_owner: codex_cco

  design_system:
    layout_config: configs/layouts.yaml
    design_spec_contract: services/design_spec.py
    renderer: services/overlay_renderer.py
    preview_script: scripts/preview_design_spec.py
    image_model_renders_required_text: false
    semantic_line_breaks_owner: creative_director
    emphasis_owner: creative_director
    exact_text_rendering_owner: python_renderer
    multiple_creatives_should_not_all_share_one_layout: true
    preview_before_paid_generation: true

  token_efficiency:
    compact_context_first: true
    raw_source_is_fallback: true
    max_benchmarks: 3
    max_visual_routes: 2
    max_fact_chips: 3
    reuse_design_spec_for_preview_renderer_and_reviewer: true
    root_cause_revision_only: true

  steps:
    - intake
    - context_preparation
    - recruitment_analysis
    - codex_fact_check
    - codex_benchmark_gate
    - creative_direction
    - codex_design_spec_approval
    - design_spec_save
    - design_spec_preview
    - codex_preview_approval
    - image_generation
    - design_spec_rendering
    - creative_review
    - codex_final_qa
    - revision_if_needed
    - human_final_approval

  owners:
    intake: codex_cco
    context_preparation: python_context_utility
    recruitment_analysis: recruitment_analyst
    codex_fact_check: codex_cco
    codex_benchmark_gate: codex_cco
    creative_direction: creative_director
    codex_design_spec_approval: codex_cco
    design_spec_save: codex_cco
    design_spec_preview: python_renderer
    codex_preview_approval: codex_cco
    image_generation: python_image_utility
    design_spec_rendering: python_renderer
    creative_review: creative_reviewer
    codex_final_qa: codex_cco
    human_final_approval: human

  output_spec_resolution:
    priority:
      - hearing_sheet_media
      - explicit_user_size
      - phase1_default
    config: configs/media.yaml
    generation_must_use_resolved_context: true

  image_generation:
    creative_context_required: true
    approved_design_spec_required: true
    design_spec_default_path: 02_direction/<creative-id>-design-spec.json
    typography_preview_required: true
    required_text_strategy: deterministic_python_design_spec
    required_outputs:
      - final_image
      - companion_copy_markdown
      - design_spec_snapshot
    copy_markdown_suffix: -copy.md

  gates:
    fact_check:
      owner: codex_cco
      purpose: 求人事実の誤り・創作を止める

    benchmark_gate:
      owner: codex_cco
      purpose: original_imageから案件に合う参考サンプルを最大3件に絞る

    design_spec_approval:
      owner: codex_cco
      purpose: Layout Family・意味改行・強調語・写真構図・日本語文言を固定する

    preview_approval:
      owner: codex_cco
      purpose: 画像生成コストを使う前にTypography・改行・情報階層を仮背景で確認する

    final_qa:
      owner: codex_cco
      purpose: Fact・Hearing・Benchmark・Design Spec・完成画像・copy.mdを横断確認する

  revision:
    max_count: 2
    return_to_responsible_specialist: true
    rerun_all_agents: false

  delivery:
    human_approval_required: true
    require_image_and_copy_file: true

  phase2_later:
    - svg_css_renderer_if_needed
    - detailed_manifest
    - bulk_generation
    - automated_cost_guard
    - slack_intake
    - server_side_orchestration

architecture:
  version: phase1_benchmark_quality_v2
  principle: "3 active Claude specialists + VSCode Codex CCO; benchmark-first quality with compact JSON handoffs"
  tuning_guide: .claude/agents/README.md
  benchmark_library_env: ORIGINAL_IMAGE_ROOT
  compact_context: scripts/prepare_creative_context.py
  output_mode: compact_json

chief:
  codex_cco:
    file: .codex/chief-creative-officer.md
    role: chief_creative_officer
    runtime: vscode_codex
    auth: chatgpt_login
    responsibilities:
      - project_scope_and_storage
      - compact_context_gate
      - fact_gate
      - benchmark_selection
      - candidate_selection
      - hearing_and_media_alignment
      - creative_direction_approval
      - root_cause_revision_routing
      - final_qa

agents:
  recruitment_analyst:
    file: .claude/agents/recruitment-analyst.md
    role: recruitment_fact_and_ad_leverage_analysis
    runtime: claude_code
    auth: subscription_login
    output: compact_json
    expertise:
      - exact_job_identity
      - facts
      - evidence
      - advertising_leverage
      - claim_boundary
      - job_reality
      - hearing_fact_separation

  creative_director:
    file: .claude/agents/creative-director.md
    role: integrated_benchmark_led_creative_direction
    runtime: claude_code
    auth: subscription_login
    output: compact_json
    expertise:
      - strategy
      - target_hypothesis
      - benchmark_translation
      - appeal_competition
      - copywriting
      - art_direction
      - typography_direction
      - image_prompt
      - hearing_media_alignment

  creative_reviewer:
    file: .claude/agents/creative-reviewer.md
    role: independent_delivery_blocking_quality_review
    runtime: claude_code
    auth: subscription_login
    output: compact_json
    expertise:
      - fact_claim_review
      - hearing_alignment
      - benchmark_alignment
      - advertising_impact
      - copy_review
      - job_reality_review
      - typography_review
      - generation_artifact_review
      - root_cause_routing

historical_specialist_files:
  note: >-
    Phase 1では直接実行しない。旧専門Agentの有用な知見はactive Creative Directorへ吸収する。
    Agent数を戻す前にactive Agent定義とbenchmark運用をチューニングする。
  production_director: .claude/agents/production-director.md
  copy_director: .claude/agents/copy-director.md
  art_director: .claude/agents/art-director.md
  prompt_designer: .claude/agents/prompt-designer.md

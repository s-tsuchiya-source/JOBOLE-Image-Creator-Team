render_modes:
  premium_ai:
    default: true
    purpose: >-
      画像AIが人物・背景・装飾・日本語テキストを一体で生成し、完成物としてのデザイン品質を最優先する。
    image_backend_env: PREMIUM_IMAGE_BACKEND
    default_backend: openai
    python_renders_required_text: false
    exact_text_contract_required: true
    local_ocr_optional: true
    ai_visual_text_review_required: true
    codex_final_visual_text_review_required: true
    max_generation_retries_for_text_error: 2
    fallback_mode: safe_python

  safe_python:
    default: false
    purpose: >-
      日本語・数値の完全な再現性が最優先、またはPremium Modeで文字誤りが解消しない場合のフォールバック。
    image_backend_env: SAFE_IMAGE_BACKEND
    default_backend: openvino_ovms
    python_renders_required_text: true
    design_spec_contract: services/design_spec.py
    renderer: services/overlay_renderer.py

verification:
  text_integrity:
    layers:
      - local_ocr_when_available
      - claude_visual_readback
      - codex_final_visual_check
    local_ocr_is_single_source_of_truth: false
    any_confirmed_fact_error_blocks_delivery: true
    any_confirmed_required_text_error_blocks_delivery: true

promotion:
  candidate_first: true
  formal_delivery_requires:
    - creative_reviewer_pass
    - codex_final_qa_pass
    - fact_integrity_pass
    - text_integrity_pass
